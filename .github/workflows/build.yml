          start = s.index('    public static class FeishuNotificationListener')
          end = s.index('    public static class AlarmService')
          listener = r'''    public static class FeishuNotificationListener extends android.service.notification.NotificationListenerService {
          private static final String[] PACKAGES = {
                  "com.ss.android.lark",
                  "com.larksuite.suite"
          };

          public static volatile boolean connected = false;

          @Override
          public void onListenerConnected() {
              super.onListenerConnected();
              connected = true;
          }

          @Override
          public void onListenerDisconnected() {
              super.onListenerDisconnected();
              connected = false;
          }

          public static boolean hasAccess(Context context) {
              String enabled = Settings.Secure.getString(
                      context.getContentResolver(), "enabled_notification_listeners");
              return enabled != null && enabled.contains(context.getPackageName());
          }

          public static void rebind(Context context) {
              try {
                  requestRebind(new ComponentName(context, FeishuNotificationListener.class));
              } catch (Exception ignored) {
              }
          }

          @Override
          public void onNotificationPosted(android.service.notification.StatusBarNotification sbn) {
              if (sbn == null) return;
              boolean isFeishu = false;
              for (String pkg : PACKAGES) {
                  if (pkg.equals(sbn.getPackageName())) {
                      isFeishu = true;
                      break;
                  }
              }
              if (!isFeishu) return;
              if (!ScheduleStore.isEnabled(this)) return;

              Notification notification = sbn.getNotification();
              Bundle extras = notification.extras;
              String title = extras.getString(Notification.EXTRA_TITLE, "飞书消息");
              String text = extras.getString(Notification.EXTRA_TEXT, "");
              if (text == null || text.isEmpty()) {
                  text = extras.getString(Notification.EXTRA_BIG_TEXT, "收到一条飞书消息");
              }

              if (!ScheduleStore.isActive(this, System.currentTimeMillis())) {
                  Extras.TriggerLogStore.log(this, title, text, "不在时段");
                  return;
              }
              if (AlarmService.isRinging) {
                  Extras.TriggerLogStore.log(this, title, text, "已在响铃");
                  return;
              }

              long now = System.currentTimeMillis();
              long last = ScheduleStore.prefs(this).getLong(ScheduleStore.KEY_LAST_RING, 0);
              if (now - last < 5000) {
                  Extras.TriggerLogStore.log(this, title, text, "冷却中");
                  return;
              }
              ScheduleStore.prefs(this).edit().putLong(ScheduleStore.KEY_LAST_RING, now).apply();
              AlarmService.trigger(this, title, text);
          }
      }

      '''
