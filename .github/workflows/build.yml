      - name: Create Extras.java
        run: |
          cat > app/src/main/java/com/example/feishualarm/Extras.java <<'EOF'
          package com.example.feishualarm;

          import android.app.*;
          import android.content.*;
          import android.content.pm.PackageManager;
          import android.content.pm.ResolveInfo;
          import android.content.res.ColorStateList;
          import android.graphics.Color;
          import android.graphics.drawable.Drawable;
          import android.graphics.drawable.GradientDrawable;
          import android.graphics.drawable.RippleDrawable;
          import android.net.Uri;
          import android.os.*;
          import android.provider.Settings;
          import android.service.notification.StatusBarNotification;
          import android.view.Gravity;
          import android.view.View;
          import android.widget.*;
          import org.json.JSONArray;
          import org.json.JSONObject;
          import java.io.File;
          import java.text.*;
          import java.util.*;

          public class Extras {
              static int dp(Context c, int v) { return MainActivity.dp(c, v); }

              static TextView text(Context c, String s, int size, int color) {
                  TextView v = new TextView(c); v.setText(s); v.setTextSize(size); v.setTextColor(color); return v;
              }

              static LinearLayout card(Context c) {
                  LinearLayout v = new LinearLayout(c);
                  v.setOrientation(LinearLayout.VERTICAL);
                  v.setPadding(dp(c, 18), dp(c, 16), dp(c, 18), dp(c, 16));
                  GradientDrawable bg = new GradientDrawable(GradientDrawable.Orientation.TL_BR, new int[]{0xE6FFFFFF, 0xCCFFFFFF});
                  bg.setCornerRadius(dp(c, 24)); bg.setStroke(dp(c, 1), 0x99FFFFFF);
                  v.setBackground(bg); v.setElevation(0);
                  LinearLayout.LayoutParams p = new LinearLayout.LayoutParams(LinearLayout.LayoutParams.MATCH_PARENT, LinearLayout.LayoutParams.WRAP_CONTENT);
                  p.bottomMargin = dp(c, 14); v.setLayoutParams(p);
                  return v;
              }

              static Button button(Context c, String s, boolean primary) {
                  Button b = new Button(c);
                  b.setText(s); b.setAllCaps(false); b.setTextSize(primary ? 15 : 14);
                  b.setTextColor(primary ? Color.WHITE : 0xFF1F2937);
                  b.setStateListAnimator(null); b.setElevation(0f);
                  GradientDrawable bg = new GradientDrawable(); bg.setColor(primary ? 0xFF2563EB : 0xFFF3F6FB); bg.setCornerRadius(dp(c, 14));
                  if (!primary) bg.setStroke(dp(c, 1), 0xFFE2E8F0);
                  b.setBackground(new RippleDrawable(ColorStateList.valueOf(primary ? 0x40FFFFFF : 0x332563EB), bg, bg));
                  MainActivity.applyPressFeedback(b);
                  return b;
              }

              static LinearLayout.LayoutParams params(Context c, boolean primary) {
                  LinearLayout.LayoutParams p = new LinearLayout.LayoutParams(LinearLayout.LayoutParams.MATCH_PARENT, dp(c, primary ? 50 : 46));
                  p.topMargin = dp(c, 8); return p;
              }

              static boolean ignoringBattery(Context c) {
                  return ((PowerManager) c.getSystemService(Context.POWER_SERVICE)).isIgnoringBatteryOptimizations(c.getPackageName());
              }

              static boolean dndAllowed(Context c) {
                  return ((NotificationManager) c.getSystemService(Context.NOTIFICATION_SERVICE)).isNotificationPolicyAccessGranted();
              }

              static boolean canFullScreen(Context c) {
                  return Build.VERSION.SDK_INT < 34 || ((NotificationManager) c.getSystemService(Context.NOTIFICATION_SERVICE)).canUseFullScreenIntent();
              }

              static boolean notificationsEnabled(Context c) {
                  NotificationManager nm = (NotificationManager) c.getSystemService(Context.NOTIFICATION_SERVICE);
                  if (!nm.areNotificationsEnabled()) return false;
                  return Build.VERSION.SDK_INT < 33 || c.checkSelfPermission("android.permission.POST_NOTIFICATIONS") == PackageManager.PERMISSION_GRANTED;
              }

              public static class MonitoredAppsStore {
                  private static final String KEY = "monitored_apps";
                  static SharedPreferences prefs(Context c) { return MainActivity.ScheduleStore.prefs(c); }
                  public static Set<String> get(Context c) {
                      return new HashSet<>(prefs(c).getStringSet(KEY, new HashSet<String>()));
                  }
                  public static boolean isSelected(Context c, String pkg) { return get(c).contains(pkg); }
                  public static void setSelected(Context c, String pkg, boolean selected) {
                      Set<String> set = get(c);
                      if (selected) set.add(pkg); else set.remove(pkg);
                      prefs(c).edit().putStringSet(KEY, set).apply();
                  }
                  public static String summary(Context c) {
                      Set<String> set = get(c);
                      if (set.isEmpty()) return "还没有选择应用，点下面按钮去勾选";
                      PackageManager pm = c.getPackageManager();
                      List<String> names = new ArrayList<>();
                      for (String pkg : set) {
                          try {
                              names.add(pm.getApplicationLabel(pm.getApplicationInfo(pkg, 0)).toString());
                          } catch (Exception ignored) {}
                      }
                      if (names.isEmpty()) return "已选应用已卸载，请重新选择";
                      Collections.sort(names, Collator.getInstance(Locale.CHINA));
                      StringBuilder sb = new StringBuilder("已选 " + names.size() + " 个：");
                      int max = Math.min(names.size(), 4);
                      for (int i = 0; i < max; i++) {
                          if (i > 0) sb.append("、");
                          sb.append(names.get(i));
                      }
                      if (names.size() > max) sb.append(" 等");
                      return sb.toString();
                  }
              }

              public static class AppPickerActivity extends Activity {
                  private LinearLayout listContainer;
                  private EditText search;
                  private ScrollView appScroll;
                  private LinearLayout indexBar;
                  private List<AppEntry> allApps = new ArrayList<>();
                  private final Map<String, View> anchors = new HashMap<>();
                  private boolean receiverRegistered = false;
                  private final BroadcastReceiver packageReceiver = new BroadcastReceiver() {
                      @Override public void onReceive(Context context, Intent intent) { loadApps(); }
                  };

                  static class AppEntry {
                      String pkg;
                      String label;
                      String initial;
                      long size;
                      Drawable icon;
                  }

                  @Override protected void onCreate(Bundle b) {
                      super.onCreate(b);
                      LinearLayout root = new LinearLayout(this);
                      root.setOrientation(LinearLayout.VERTICAL);
                      root.setPadding(dp(this, 18), dp(this, 24), dp(this, 18), dp(this, 20));
                      root.setBackground(new GradientDrawable(GradientDrawable.Orientation.TL_BR, new int[]{0xFFF9FBFF, 0xFFEAF1FB, 0xFFF5F7FC}));

                      root.addView(text(this, "选择要监控的应用", 26, 0xFF1E2430));
                      TextView sub = text(this, "勾选后，这些应用的通知会在设定时间段响铃", 13, 0xFF6B7280);
                      sub.setPadding(0, dp(this, 4), 0, dp(this, 14));
                      root.addView(sub);

                      search = new EditText(this);
                      search.setHint("搜索应用");
                      search.setSingleLine(true);
                      search.setTextSize(14);
                      search.setPadding(dp(this, 14), 0, dp(this, 14), 0);
                      GradientDrawable searchBg = new GradientDrawable();
                      searchBg.setColor(0xFFFFFFFF);
                      searchBg.setCornerRadius(dp(this, 15));
                      searchBg.setStroke(dp(this, 1), 0xFFE2E8F0);
                      search.setBackground(searchBg);
                      LinearLayout.LayoutParams searchParams = new LinearLayout.LayoutParams(
                              LinearLayout.LayoutParams.MATCH_PARENT, dp(this, 46));
                      searchParams.bottomMargin = dp(this, 10);
                      root.addView(search, searchParams);
                      search.addTextChangedListener(new android.text.TextWatcher() {
                          @Override public void afterTextChanged(android.text.Editable s) { renderList(); }
                          @Override public void beforeTextChanged(CharSequence s, int start, int count, int after) {}
                          @Override public void onTextChanged(CharSequence s, int start, int before, int count) {}
                      });

                      FrameLayout listFrame = new FrameLayout(this);
                      LinearLayout.LayoutParams frameParams = new LinearLayout.LayoutParams(
                              LinearLayout.LayoutParams.MATCH_PARENT, 0, 1f);
                      root.addView(listFrame, frameParams);

                      appScroll = new ScrollView(this);
                      listContainer = new LinearLayout(this);
                      listContainer.setOrientation(LinearLayout.VERTICAL);
                      listContainer.setPadding(0, 0, dp(this, 26), 0);
                      appScroll.addView(listContainer);
                      listFrame.addView(appScroll, new FrameLayout.LayoutParams(
                              FrameLayout.LayoutParams.MATCH_PARENT,
                              FrameLayout.LayoutParams.MATCH_PARENT));

                      indexBar = new LinearLayout(this);
                      indexBar.setOrientation(LinearLayout.VERTICAL);
                      indexBar.setGravity(Gravity.CENTER_VERTICAL);
                      FrameLayout.LayoutParams indexParams = new FrameLayout.LayoutParams(
                              dp(this, 24), FrameLayout.LayoutParams.MATCH_PARENT);
                      indexParams.gravity = Gravity.END | Gravity.CENTER_VERTICAL;
                      listFrame.addView(indexBar, indexParams);
                      buildIndexBar();

                      Button done = button(this, "完成", true);
                      done.setOnClickListener(v -> finish());
                      root.addView(done, params(this, true));
                      setContentView(root);
                  }

                  @Override protected void onResume() {
                      super.onResume();
                      IntentFilter filter = new IntentFilter();
                      filter.addAction(Intent.ACTION_PACKAGE_ADDED);
                      filter.addAction(Intent.ACTION_PACKAGE_REMOVED);
                      filter.addAction(Intent.ACTION_PACKAGE_REPLACED);
                      filter.addDataScheme("package");
                      if (Build.VERSION.SDK_INT >= 33) {
                          registerReceiver(packageReceiver, filter, Context.RECEIVER_NOT_EXPORTED);
                      } else {
                          registerReceiver(packageReceiver, filter);
                      }
                      receiverRegistered = true;
                      loadApps();
                  }

                  @Override protected void onPause() {
                      if (receiverRegistered) {
                          try { unregisterReceiver(packageReceiver); } catch (Exception ignored) {}
                          receiverRegistered = false;
                      }
                      super.onPause();
                  }

                  private void buildIndexBar() {
                      indexBar.removeAllViews();
                      String letters = "ABCDEFGHIJKLMNOPQRSTUVWXYZ#";
                      for (int i = 0; i < letters.length(); i++) {
                          final String letter = String.valueOf(letters.charAt(i));
                          TextView tv = text(this, letter, 9, 0xFF6B7280);
                          tv.setGravity(Gravity.CENTER);
                          tv.setClickable(true);
                          tv.setOnClickListener(v -> jumpTo(letter));
                          LinearLayout.LayoutParams lp = new LinearLayout.LayoutParams(
                                  LinearLayout.LayoutParams.MATCH_PARENT, 0, 1f);
                          indexBar.addView(tv, lp);
                      }
                  }

                  private void jumpTo(String letter) {
                      final View target = anchors.get(letter);
                      if (target != null) {
                          appScroll.post(() -> appScroll.smoothScrollTo(0, target.getTop()));
                      }
                  }

                  private void loadApps() {
                      PackageManager pm = getPackageManager();
                      Intent intent = new Intent(Intent.ACTION_MAIN, null);
                      intent.addCategory(Intent.CATEGORY_LAUNCHER);
                      List<ResolveInfo> infos = pm.queryIntentActivities(intent, 0);
                      List<AppEntry> apps = new ArrayList<>();
                      Set<String> seen = new HashSet<>();
                      for (ResolveInfo ri : infos) {
                          String pkg = ri.activityInfo.packageName;
                          if (pkg.equals(getPackageName()) || seen.contains(pkg)) continue;
                          seen.add(pkg);
                          AppEntry e = new AppEntry();
                          e.pkg = pkg;
                          e.label = ri.loadLabel(pm).toString();
                          e.icon = ri.loadIcon(pm);
                          e.initial = initialOf(e.label);
                          try {
                              e.size = new File(ri.activityInfo.applicationInfo.sourceDir).length();
                          } catch (Exception ignored) {
                              e.size = 0;
                          }
                          apps.add(e);
                      }
                      final Collator collator = Collator.getInstance(Locale.CHINA);
                      Collections.sort(apps, (a, b) -> {
                          int ia = indexOf(a.initial);
                          int ib = indexOf(b.initial);
                          if (ia != ib) return ia - ib;
                          return collator.compare(a.label, b.label);
                      });
                      allApps = apps;
                      renderList();
                  }

                  private int indexOf(String initial) {
                      if (initial == null || initial.isEmpty()) return 26;
                      char c = initial.charAt(0);
                      if (c >= 'A' && c <= 'Z') return c - 'A';
                      return 26;
                  }

                  private String initialOf(String label) {
                      if (label == null || label.isEmpty()) return "#";
                      char c = label.charAt(0);
                      if (c >= 'A' && c <= 'Z') return String.valueOf(c);
                      if (c >= 'a' && c <= 'z') return String.valueOf(Character.toUpperCase(c));
                      if (Character.isDigit(c)) return "#";
                      if (Build.VERSION.SDK_INT >= 29) {
                          try {
                              android.icu.text.Transliterator t =
                                      android.icu.text.Transliterator.getInstance("Han-Latin");
                              String latin = t.transliterate(String.valueOf(c));
                              latin = Normalizer.normalize(latin, Normalizer.Form.NFD).replaceAll("\\p{M}", "");
                              if (!latin.isEmpty()) {
                                  char l = Character.toUpperCase(latin.charAt(0));
                                  if (l >= 'A' && l <= 'Z') return String.valueOf(l);
                              }
                          } catch (Exception ignored) {
                          }
                      }
                      return "#";
                  }

                  private String formatSize(long bytes) {
                      if (bytes <= 0) return "未知大小";
                      if (bytes >= 1024L * 1024 * 1024) {
                          return String.format(Locale.CHINA, "%.2f GB", bytes / 1073741824.0);
                      }
                      if (bytes >= 1024L * 1024) {
                          return String.format(Locale.CHINA, "%.1f MB", bytes / 1048576.0);
                      }
                      return String.format(Locale.CHINA, "%.0f KB", bytes / 1024.0);
                  }

                  private void renderList() {
                      if (listContainer == null) return;
                      listContainer.removeAllViews();
                      anchors.clear();
                      String q = search.getText().toString().trim().toLowerCase(Locale.CHINA);
                      int shown = 0;
                      for (AppEntry app : allApps) {
                          if (!q.isEmpty() && !app.label.toLowerCase(Locale.CHINA).contains(q)) continue;

                          LinearLayout row = new LinearLayout(this);
                          row.setOrientation(LinearLayout.HORIZONTAL);
                          row.setGravity(Gravity.CENTER_VERTICAL);
                          row.setMinimumHeight(dp(this, 64));
                          row.setPadding(0, dp(this, 8), dp(this, 4), dp(this, 8));

                          ImageView icon = new ImageView(this);
                          icon.setScaleType(ImageView.ScaleType.FIT_CENTER);
                          row.addView(icon, new LinearLayout.LayoutParams(dp(this, 44), dp(this, 44)));
                          icon.setImageDrawable(app.icon);

                          LinearLayout textBox = new LinearLayout(this);
                          textBox.setOrientation(LinearLayout.VERTICAL);
                          LinearLayout.LayoutParams textParams = new LinearLayout.LayoutParams(
                                  0, LinearLayout.LayoutParams.WRAP_CONTENT, 1);
                          textParams.leftMargin = dp(this, 12);
                          row.addView(textBox, textParams);

                          TextView name = text(this, app.label, 15, 0xFF1F2937);
                          textBox.addView(name);
                          TextView size = text(this, formatSize(app.size), 12, 0xFF9CA3AF);
                          size.setPadding(0, dp(this, 2), 0, 0);
                          textBox.addView(size);

                          CheckBox box = new CheckBox(this);
                          box.setChecked(MonitoredAppsStore.isSelected(this, app.pkg));
                          row.addView(box, new LinearLayout.LayoutParams(dp(this, 48), dp(this, 48)));
                          row.setOnClickListener(v -> box.setChecked(!box.isChecked()));
                          box.setOnCheckedChangeListener((v, checked) ->
                                  MonitoredAppsStore.setSelected(this, app.pkg, checked));

                          if (!anchors.containsKey(app.initial)) {
                              anchors.put(app.initial, row);
                          }
                          listContainer.addView(row);

                          View divider = new View(this);
                          divider.setBackgroundColor(0xFFEDF0F4);
                          listContainer.addView(divider, new LinearLayout.LayoutParams(
                                  LinearLayout.LayoutParams.MATCH_PARENT, dp(this, 1)));
                          shown++;
                      }
                      if (shown == 0) {
                          TextView empty = text(this, "没有匹配的应用", 13, 0xFF6B7280);
                          empty.setPadding(0, dp(this, 12), 0, dp(this, 12));
                          listContainer.addView(empty);
                      }
                  }
              }

              public static class NotifyListener extends android.service.notification.NotificationListenerService {
                  public static volatile boolean connected = false;

                  @Override public void onListenerConnected() {
                      connected = true;
                      WatchdogReceiver.schedule(this);
                  }
                  @Override public void onListenerDisconnected() { connected = false; }

                  public static boolean hasAccess(Context c) {
                      String enabled = Settings.Secure.getString(c.getContentResolver(), "enabled_notification_listeners");
                      return enabled != null && enabled.contains(NotifyListener.class.getName());
                  }

                  public static void rebind(Context c) {
                      try { requestRebind(new ComponentName(c, NotifyListener.class)); } catch (Exception ignored) {}
                  }

                  @Override public void onNotificationPosted(StatusBarNotification sbn) {
                      if (sbn == null) return;
                      String pkg = sbn.getPackageName();
                      if (pkg.equals(getPackageName())) return;
                      if (!MainActivity.ScheduleStore.isEnabled(this)) return;
                      if (!MonitoredAppsStore.isSelected(this, pkg)) return;

                      Notification notification = sbn.getNotification();
                      if (notification == null) return;
                      int flags = notification.flags;
                      if ((flags & Notification.FLAG_ONGOING_EVENT) != 0) return;
                      if ((flags & Notification.FLAG_FOREGROUND_SERVICE) != 0) return;
                      if ((flags & Notification.FLAG_GROUP_SUMMARY) != 0) return;

                      Bundle extras = notification.extras;
                      String fallback = "应用消息";
                      try {
                          fallback = getPackageManager().getApplicationLabel(
                                  getPackageManager().getApplicationInfo(pkg, 0)).toString();
                      } catch (Exception ignored) {}
                      String title = extras.getString(Notification.EXTRA_TITLE, fallback);
                      String text = extras.getString(Notification.EXTRA_TEXT, "");
                      if (text == null || text.isEmpty()) text = extras.getString(Notification.EXTRA_BIG_TEXT, "收到一条新消息");

                      long now = System.currentTimeMillis();
                      if (!MainActivity.ScheduleStore.isActive(this, now)) {
                          TriggerLogStore.log(this, title, text, "不在时段");
                          return;
                      }
                      if (MainActivity.AlarmService.isRinging) {
                          TriggerLogStore.log(this, title, text, "已在响铃");
                          return;
                      }
                      long last = MainActivity.ScheduleStore.prefs(this).getLong(MainActivity.ScheduleStore.KEY_LAST_RING, 0);
                      if (now - last < 5000) {
                          TriggerLogStore.log(this, title, text, "冷却中");
                          return;
                      }
                      MainActivity.ScheduleStore.prefs(this).edit().putLong(MainActivity.ScheduleStore.KEY_LAST_RING, now).apply();
                      TriggerLogStore.log(this, title, text, "已响铃");
                      MainActivity.AlarmService.trigger(this, title, text);
                  }
              }

              public static class BootReceiver extends BroadcastReceiver {
                  @Override public void onReceive(Context context, Intent intent) {
                      if (!MainActivity.ScheduleStore.isEnabled(context)) return;
                      WatchdogReceiver.schedule(context);
                      try { MainActivity.AlarmService.startGuard(context); } catch (Exception ignored) {}
                  }
              }

              public static class WatchdogReceiver extends BroadcastReceiver {
                  public static void schedule(Context c) {
                      try {
                          AlarmManager am = (AlarmManager) c.getSystemService(Context.ALARM_SERVICE);
                          Intent i = new Intent(c, WatchdogReceiver.class);
                          PendingIntent pi = PendingIntent.getBroadcast(c, 1001, i, PendingIntent.FLAG_UPDATE_CURRENT | PendingIntent.FLAG_IMMUTABLE);
                          am.setInexactRepeating(AlarmManager.RTC_WAKEUP, System.currentTimeMillis() + 15 * 60 * 1000L, 15 * 60 * 1000L, pi);
                      } catch (Exception ignored) {}
                  }
                  public static void cancel(Context c) {
                      try {
                          AlarmManager am = (AlarmManager) c.getSystemService(Context.ALARM_SERVICE);
                          Intent i = new Intent(c, WatchdogReceiver.class);
                          PendingIntent pi = PendingIntent.getBroadcast(c, 1001, i, PendingIntent.FLAG_UPDATE_CURRENT | PendingIntent.FLAG_IMMUTABLE);
                          am.cancel(pi); pi.cancel();
                      } catch (Exception ignored) {}
                  }
                  @Override public void onReceive(Context context, Intent intent) {
                      if (!MainActivity.ScheduleStore.isEnabled(context)) return;
                      schedule(context);
                      if (!NotifyListener.hasAccess(context)) {
                          notify(context, "通知使用权被关闭了，应用消息不会再响铃。点此去开启。");
                          return;
                      }
                      if (!NotifyListener.connected) NotifyListener.rebind(context);
                      try { MainActivity.AlarmService.startGuard(context); } catch (Exception ignored) {}
                  }
                  private void notify(Context context, String msg) {
                      try {
                          NotificationManager nm = (NotificationManager) context.getSystemService(Context.NOTIFICATION_SERVICE);
                          nm.createNotificationChannel(new NotificationChannel("duty_watchdog", "监控异常提醒", NotificationManager.IMPORTANCE_DEFAULT));
                          Intent open = new Intent(context, MainActivity.class);
                          PendingIntent pi = PendingIntent.getActivity(context, 12, open, PendingIntent.FLAG_UPDATE_CURRENT | PendingIntent.FLAG_IMMUTABLE);
                          Notification n = new Notification.Builder(context, "duty_watchdog")
                                  .setSmallIcon(android.R.drawable.ic_dialog_alert)
                                  .setContentTitle("监控异常")
                                  .setContentText(msg)
                                  .setStyle(new Notification.BigTextStyle().bigText(msg))
                                  .setContentIntent(pi).setAutoCancel(true).build();
                          nm.notify(3, n);
                      } catch (Exception ignored) {}
                  }
              }

              public static class TriggerLogStore {
                  private static final String KEY = "trigger_logs";
                  public static class Entry { public long time; public String title; public String text; public String result; }
                  static SharedPreferences prefs(Context c) { return MainActivity.ScheduleStore.prefs(c); }
                  public static void log(Context c, String title, String text, String result) {
                      List<Entry> list = getLogs(c);
                      Entry e = new Entry(); e.time = System.currentTimeMillis();
                      e.title = title == null ? "" : title; e.text = text == null ? "" : text; e.result = result;
                      list.add(0, e);
                      while (list.size() > 50) list.remove(list.size() - 1);
                      JSONArray arr = new JSONArray();
                      for (Entry x : list) {
                          try {
                              JSONObject o = new JSONObject();
                              o.put("time", x.time); o.put("title", x.title); o.put("text", x.text); o.put("result", x.result);
                              arr.put(o);
                          } catch (Exception ignored) {}
                      }
                      prefs(c).edit().putString(KEY, arr.toString()).apply();
                  }
                  public static List<Entry> getLogs(Context c) {
                      List<Entry> list = new ArrayList<>();
                      try {
                          JSONArray arr = new JSONArray(prefs(c).getString(KEY, "[]"));
                          for (int i = 0; i < arr.length(); i++) {
                              JSONObject o = arr.getJSONObject(i);
                              Entry e = new Entry();
                              e.time = o.optLong("time"); e.title = o.optString("title"); e.text = o.optString("text"); e.result = o.optString("result");
                              list.add(e);
                          }
                      } catch (Exception ignored) {}
                      return list;
                  }
                  public static void clear(Context c) { prefs(c).edit().remove(KEY).apply(); }
                  public static String latest(Context c) {
                      List<Entry> list = getLogs(c);
                      if (list.isEmpty()) return "暂无记录";
                      return new SimpleDateFormat("MM-dd HH:mm", Locale.CHINA).format(new Date(list.get(0).time)) + " " + list.get(0).result;
                  }
              }

              public static class TriggerLogActivity extends Activity {
                  @Override protected void onCreate(Bundle b) { super.onCreate(b); render(); }
                  private void render() {
                      ScrollView scroll = new ScrollView(this);
                      LinearLayout root = new LinearLayout(this);
                      root.setOrientation(LinearLayout.VERTICAL);
                      root.setPadding(dp(this, 18), dp(this, 24), dp(this, 18), dp(this, 32));
                      root.setBackground(new GradientDrawable(GradientDrawable.Orientation.TL_BR, new int[]{0xFFF9FBFF, 0xFFEAF1FB, 0xFFF5F7FC}));
                      root.addView(text(this, "触发日志", 26, 0xFF1E2430));
                      TextView sub = text(this, "最近 50 条通知的处理结果", 13, 0xFF6B7280);
                      sub.setPadding(0, dp(this, 4), 0, dp(this, 14)); root.addView(sub);
                      List<TriggerLogStore.Entry> logs = TriggerLogStore.getLogs(this);
                      if (logs.isEmpty()) root.addView(text(this, "还没有记录", 13, 0xFF6B7280));
                      SimpleDateFormat f = new SimpleDateFormat("MM-dd HH:mm:ss", Locale.CHINA);
                      for (TriggerLogStore.Entry e : logs) {
                          LinearLayout c = card(this);
                          LinearLayout head = new LinearLayout(this); head.setOrientation(LinearLayout.HORIZONTAL); head.setGravity(Gravity.CENTER_VERTICAL);
                          TextView time = text(this, f.format(new Date(e.time)), 12, 0xFF6B7280);
                          time.setLayoutParams(new LinearLayout.LayoutParams(0, LinearLayout.LayoutParams.WRAP_CONTENT, 1)); head.addView(time);
                          head.addView(text(this, e.result, 12, resultColor(e.result))); c.addView(head);
                          c.addView(text(this, e.title, 14, 0xFF1F2937));
                          if (!e.text.isEmpty()) { TextView body = text(this, e.text, 12, 0xFF6B7280); body.setPadding(0, dp(this, 3), 0, 0); c.addView(body); }
                          root.addView(c);
                      }
                      Button clear = button(this, "清空记录", false);
                      clear.setOnClickListener(v -> { TriggerLogStore.clear(this); render(); });
                      root.addView(clear, params(this, false));
                      scroll.addView(root); setContentView(scroll);
                  }
                  private int resultColor(String r) { if ("已响铃".equals(r)) return 0xFFDC2626; if ("已停止".equals(r)) return 0xFF16A34A; return 0xFF6B7280; }
              }
          }
