              try {
                  AlarmManager am = (AlarmManager) context.getSystemService(Context.ALARM_SERVICE);
                  Intent intent = new Intent(context, Extras.WatchdogReceiver.class);
                  PendingIntent pi = PendingIntent.getBroadcast(context, 1001, intent,
                          PendingIntent.FLAG_UPDATE_CURRENT | PendingIntent.FLAG_IMMUTABLE);
                  am.setInexactRepeating(AlarmManager.RTC_WAKEUP,
                          System.currentTimeMillis() + 15 * 60 * 1000L,
                          15 * 60 * 1000L, pi);
              } catch (Exception ignored) {
              }
          }

          public static void cancelWatchdog(Context context) {
              try {
                  AlarmManager am = (AlarmManager) context.getSystemService(Context.ALARM_SERVICE);
                  Intent intent = new Intent(context, Extras.WatchdogReceiver.class);
                  PendingIntent pi = PendingIntent.getBroadcast(context, 1001, intent,
                          PendingIntent.FLAG_UPDATE_CURRENT | PendingIntent.FLAG_IMMUTABLE);
                  am.cancel(pi);
                  pi.cancel();
              } catch (Exception ignored) {
              }
          }

          @Override
          public void onCreate() {
              super.onCreate();
              guardRunning = true;
              createChannels();
              startForeground(ID_GUARD, guardNotification());
              scheduleWatchdog(this);
          }''')

