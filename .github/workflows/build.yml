name: Build Feishu Alarm APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Restore project from previous build
        run: |
          python3 - <<'PY'
          import subprocess, sys
          path = '.github/workflows/build.yml'
          commits = subprocess.check_output(['git', 'log', '--format=%H', '--', path]).decode().split()
          for sha in commits[1:]:
              try:
                  content = subprocess.check_output(['git', 'show', f'{sha}:{path}']).decode('utf-8')
                  lines = content.splitlines()
                  start = None
                  for i, line in enumerate(lines):
                      if line.strip() == '- name: Create project files':
                          start = i
                          break
                  if start is None:
                      continue
                  run_at = None
                  for i in range(start, len(lines)):
                      if lines[i].strip() == 'run: |':
                          run_at = i
                          break
                  if run_at is None:
                      continue
                  script_lines = []
                  for line in lines[run_at + 1:]:
                      if line.strip() == '':
                          script_lines.append('')
                      elif line.startswith('          '):
                          script_lines.append(line[10:])
                      else:
                          break
                  script = '\n'.join(script_lines)
                  subprocess.run(script, shell=True, executable='/bin/bash', check=True)
                  print('Restored project files from ' + sha)
                  sys.exit(0)
              except SystemExit:
                  raise
              except Exception as exc:
                  print('skip ' + sha + ': ' + str(exc))
          print('ERROR: previous build.yml with Create project files not found')
          sys.exit(1)
          PY

      - name: Overwrite manifest
        run: |
          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <uses-permission android:name="android.permission.FOREGROUND_SERVICE" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE_SPECIAL_USE" />
              <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />
              <uses-permission android:name="android.permission.WAKE_LOCK" />
              <uses-permission android:name="android.permission.VIBRATE" />
              <uses-permission android:name="android.permission.MODIFY_AUDIO_SETTINGS" />
              <uses-permission android:name="android.permission.REQUEST_IGNORE_BATTERY_OPTIMIZATIONS" />
              <uses-permission android:name="android.permission.USE_FULL_SCREEN_INTENT" />
              <uses-permission android:name="android.permission.ACCESS_NOTIFICATION_POLICY" />
              <uses-permission android:name="android.permission.RECEIVE_BOOT_COMPLETED" />

              <application
                  android:allowBackup="true"
                  android:label="飞书夜班铃声"
                  android:theme="@android:style/Theme.Material.Light.NoActionBar">

                  <activity
                      android:name=".MainActivity"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>

                  <activity
                      android:name=".MainActivity$AlarmActivity"
                      android:exported="false"
                      android:launchMode="singleInstance"
                      android:excludeFromRecents="true"
                      android:showWhenLocked="true"
                      android:turnScreenOn="true" />

                  <activity
                      android:name=".Extras$PermissionCheckActivity"
                      android:exported="false" />
                  <activity
                      android:name=".Extras$TriggerLogActivity"
                      android:exported="false" />
                  <activity
                      android:name=".Extras$ShiftPatternActivity"
                      android:exported="false" />

                  <service
                      android:name=".MainActivity$AlarmService"
                      android:exported="false"
                      android:foregroundServiceType="specialUse">
                      <property
                          android:name="android.app.PROPERTY_SPECIAL_USE_FGS_SUBTYPE"
                          android:value="feishu alarm guard" />
                  </service>

                  <service
                      android:name=".MainActivity$FeishuNotificationListener"
                      android:exported="false"
                      android:permission="android.permission.BIND_NOTIFICATION_LISTENER_SERVICE">
                      <intent-filter>
                          <action android:name="android.service.notification.NotificationListenerService" />
                      </intent-filter>
                  </service>

                  <receiver
                      android:name=".Extras$BootReceiver"
                      android:exported="true"
                      android:enabled="true">
                      <intent-filter>
                          <action android:name="android.intent.action.BOOT_COMPLETED" />
                          <action android:name="android.intent.action.MY_PACKAGE_REPLACED" />
                          <action android:name="android.intent.action.QUICKBOOT_POWERON" />
                      </intent-filter>
                  </receiver>

                  <receiver
                      android:name=".Extras$WatchdogReceiver"
                      android:exported="false" />
              </application>
          </manifest>
          EOF

      - name: Create Extras.java
        run: |
          cat > app/src/main/java/com/example/feishualarm/Extras.java <<'EOF'
          package com.example.feishualarm;

          import android.app.*;
          import android.content.*;
          import android.content.pm.PackageManager;
          import android.content.res.ColorStateList;
          import android.graphics.Color;
          import android.graphics.drawable.GradientDrawable;
          import android.graphics.drawable.RippleDrawable;
          import android.net.Uri;
          import android.os.*;
          import android.provider.Settings;
          import android.view.Gravity;
          import android.view.View;
          import android.widget.*;
          import org.json.JSONArray;
          import org.json.JSONObject;
          import java.text.SimpleDateFormat;
          import java.util.*;

          public class Extras {
              static int dp(Context c, int v) { return MainActivity.dp(c, v); }

              static TextView text(Context c, String s, int size, int color) {
                  TextView v = new TextView(c); v.setText(s); v.setTextSize(size); v.setTextColor(color); return v;
              }

              static LinearLayout card(Context c) {
                  LinearLayout v = new LinearLayout(c);
                  v.setOrientation(LinearLayout.VERTICAL);
                  v.setPadding(dp(c, 18), dp(c, 16), dp(c, 18), dp(c, 16));
                  GradientDrawable bg = new GradientDrawable(GradientDrawable.Orientation.TL_BR, new int[]{0xE6FFFFFF, 0xCCFFFFFF});
                  bg.setCornerRadius(dp(c, 24)); bg.setStroke(dp(c, 1), 0x99FFFFFF);
                  v.setBackground(bg); v.setElevation(0);
                  LinearLayout.LayoutParams p = new LinearLayout.LayoutParams(LinearLayout.LayoutParams.MATCH_PARENT, LinearLayout.LayoutParams.WRAP_CONTENT);
                  p.bottomMargin = dp(c, 14); v.setLayoutParams(p);
                  return v;
              }

              static Button button(Context c, String s, boolean primary) {
                  Button b = new Button(c);
                  b.setText(s); b.setAllCaps(false); b.setTextSize(primary ? 15 : 14);
                  b.setTextColor(primary ? Color.WHITE : 0xFF1F2937);
                  b.setStateListAnimator(null); b.setElevation(0f);
                  GradientDrawable bg = new GradientDrawable(); bg.setColor(primary ? 0xFF2563EB : 0xFFF3F6FB); bg.setCornerRadius(dp(c, 14));
                  if (!primary) bg.setStroke(dp(c, 1), 0xFFE2E8F0);
                  b.setBackground(new RippleDrawable(ColorStateList.valueOf(primary ? 0x40FFFFFF : 0x332563EB), bg, bg));
                  MainActivity.applyPressFeedback(b);
                  return b;
              }

              static LinearLayout.LayoutParams params(Context c, boolean primary) {
                  LinearLayout.LayoutParams p = new LinearLayout.LayoutParams(LinearLayout.LayoutParams.MATCH_PARENT, dp(c, primary ? 50 : 46));
                  p.topMargin = dp(c, 8); return p;
              }

              public static class BootReceiver extends BroadcastReceiver {
                  @Override public void onReceive(Context context, Intent intent) {
                      if (!MainActivity.ScheduleStore.isEnabled(context)) return;
                      try { MainActivity.AlarmService.startGuard(context); } catch (Exception ignored) {}
                      MainActivity.AlarmService.scheduleWatchdog(context);
                  }
              }

              public static class WatchdogReceiver extends BroadcastReceiver {
                  @Override public void onReceive(Context context, Intent intent) {
                      if (!MainActivity.ScheduleStore.isEnabled(context)) return;
                      MainActivity.AlarmService.scheduleWatchdog(context);
                      if (!MainActivity.FeishuNotificationListener.hasAccess(context)) {
                          notify(context, "通知使用权被关闭了，飞书消息不会再响铃。点此去开启。");
                          return;
                      }
                      if (!MainActivity.FeishuNotificationListener.connected) {
                          MainActivity.FeishuNotificationListener.rebind(context);
                      }
                      if (!MainActivity.AlarmService.guardRunning) {
                          try { MainActivity.AlarmService.startGuard(context); } catch (Exception ignored) {}
                      }
                  }
                  private void notify(Context context, String msg) {
                      try {
                          NotificationManager nm = (NotificationManager) context.getSystemService(Context.NOTIFICATION_SERVICE);
                          nm.createNotificationChannel(new NotificationChannel("feishu_watchdog", "监控异常提醒", NotificationManager.IMPORTANCE_DEFAULT));
                          Intent open = new Intent(context, MainActivity.class);
                          PendingIntent pi = PendingIntent.getActivity(context, 12, open, PendingIntent.FLAG_UPDATE_CURRENT | PendingIntent.FLAG_IMMUTABLE);
                          Notification n = new Notification.Builder(context, "feishu_watchdog")
                                  .setSmallIcon(android.R.drawable.ic_dialog_alert)
                                  .setContentTitle("飞书监控异常")
                                  .setContentText(msg)
                                  .setStyle(new Notification.BigTextStyle().bigText(msg))
                                  .setContentIntent(pi).setAutoCancel(true).build();
                          nm.notify(3, n);
                      } catch (Exception ignored) {}
                  }
              }

              public static class TriggerLogStore {
                  private static final String KEY = "trigger_logs";
                  public static class Entry { public long time; public String title; public String text; public String result; }
                  static SharedPreferences prefs(Context c) { return MainActivity.ScheduleStore.prefs(c); }
                  public static void log(Context c, String title, String text, String result) {
                      List<Entry> list = getLogs(c);
                      Entry e = new Entry(); e.time = System.currentTimeMillis();
                      e.title = title == null ? "" : title; e.text = text == null ? "" : text; e.result = result;
                      list.add(0, e);
                      while (list.size() > 50) list.remove(list.size() - 1);
                      JSONArray arr = new JSONArray();
                      for (Entry x : list) {
                          try {
                              JSONObject o = new JSONObject();
                              o.put("time", x.time); o.put("title", x.title); o.put("text", x.text); o.put("result", x.result);
                              arr.put(o);
                          } catch (Exception ignored) {}
                      }
                      prefs(c).edit().putString(KEY, arr.toString()).apply();
                  }
                  public static List<Entry> getLogs(Context c) {
                      List<Entry> list = new ArrayList<>();
                      try {
                          JSONArray arr = new JSONArray(prefs(c).getString(KEY, "[]"));
                          for (int i = 0; i < arr.length(); i++) {
                              JSONObject o = arr.getJSONObject(i);
                              Entry e = new Entry();
                              e.time = o.optLong("time"); e.title = o.optString("title"); e.text = o.optString("text"); e.result = o.optString("result");
                              list.add(e);
                          }
                      } catch (Exception ignored) {}
                      return list;
                  }
                  public static void clear(Context c) { prefs(c).edit().remove(KEY).apply(); }
                  public static String latest(Context c) {
                      List<Entry> list = getLogs(c);
                      if (list.isEmpty()) return "暂无记录";
                      return new SimpleDateFormat("MM-dd HH:mm", Locale.CHINA).format(new Date(list.get(0).time)) + " " + list.get(0).result;
                  }
              }

              public static class PermissionCheckActivity extends Activity {
                  @Override protected void onCreate(Bundle b) { super.onCreate(b); render(); }
                  @Override protected void onResume() { super.onResume(); render(); }
                  @Override public void onRequestPermissionsResult(int code, String[] p, int[] r) { super.onRequestPermissionsResult(code, p, r); render(); }
                  private void render() {
                      ScrollView scroll = new ScrollView(this);
                      LinearLayout root = new LinearLayout(this);
                      root.setOrientation(LinearLayout.VERTICAL);
                      root.setPadding(dp(this, 18), dp(this, 24), dp(this, 18), dp(this, 32));
                      root.setBackground(new GradientDrawable(GradientDrawable.Orientation.TL_BR, new int[]{0xFFF9FBFF, 0xFFEAF1FB, 0xFFF5F7FC}));
                      root.addView(text(this, "权限自检", 26, 0xFF1E2430));
                      TextView sub = text(this, "全部绿灯，飞书消息才不会被系统拦掉", 13, 0xFF6B7280);
                      sub.setPadding(0, dp(this, 4), 0, dp(this, 14)); root.addView(sub);
                      addRow(root, "通知使用权", "读取飞书通知的钥匙", hasAccess(), "去开启", v -> open(new Intent(Settings.ACTION_NOTIFICATION_LISTENER_SETTINGS)), null);
                      addRow(root, "通知权限", "Android 13 以上要允许本 App 发通知", notificationsEnabled(), "去开启", v -> askNotify(), null);
                      addRow(root, "电池优化白名单", "防止系统把后台监控杀掉", ignoringBattery(), "去设置", v -> open(new Intent(Settings.ACTION_REQUEST_IGNORE_BATTERY_OPTIMIZATIONS, Uri.parse("package:" + getPackageName()))), null);
                      addRow(root, "勿扰访问权限", "读取勿扰状态，避免静音时漏消息", dndAllowed(), "去授权", v -> open(new Intent(Settings.ACTION_NOTIFICATION_POLICY_ACCESS_SETTINGS)), null);
                      if (Build.VERSION.SDK_INT >= 34) {
                          addRow(root, "全屏通知", "锁屏时弹出响铃页面", canFullScreen(), "去允许", v -> open(new Intent(Settings.ACTION_MANAGE_APP_USE_FULL_SCREEN_INTENT, Uri.parse("package:" + getPackageName()))), null);
                      } else {
                          addRow(root, "全屏通知", "当前系统版本默认允许", true, "", null, null);
                      }
                      addRow(root, "自启动 / 后台弹出", "小米、OPPO、vivo 等机型需在厂商设置里手动允许", false, "去查看", v -> open(new Intent(Settings.ACTION_APPLICATION_DETAILS_SETTINGS, Uri.parse("package:" + getPackageName()))), "需手动确认");
                      Button refresh = button(this, "刷新状态", true);
                      refresh.setOnClickListener(v -> render());
                      root.addView(refresh, params(this, true));
                      scroll.addView(root); setContentView(scroll);
                  }
                  private void addRow(LinearLayout parent, String title, String desc, boolean ok, String action, View.OnClickListener listener, String override) {
                      LinearLayout c = card(this);
                      LinearLayout head = new LinearLayout(this); head.setOrientation(LinearLayout.HORIZONTAL); head.setGravity(Gravity.CENTER_VERTICAL);
                      TextView t = text(this, title, 15, 0xFF1F2937); t.setLayoutParams(new LinearLayout.LayoutParams(0, LinearLayout.LayoutParams.WRAP_CONTENT, 1)); head.addView(t);
                      String status = override != null ? override : (ok ? "已开启" : "未开启");
                      int color = override != null ? 0xFF6B7280 : (ok ? 0xFF16A34A : 0xFFDC2626);
                      head.addView(text(this, status, 12, color)); c.addView(head);
                      TextView d = text(this, desc, 12, 0xFF6B7280); d.setPadding(0, dp(this, 4), 0, dp(this, 8)); c.addView(d);
                      if (!ok && listener != null) { Button b = button(this, action, false); b.setOnClickListener(listener); c.addView(b, params(this, false)); }
                      parent.addView(c);
                  }
                  private boolean hasAccess() { return MainActivity.FeishuNotificationListener.hasAccess(this); }
                  private boolean notificationsEnabled() {
                      NotificationManager nm = (NotificationManager) getSystemService(NOTIFICATION_SERVICE);
                      if (!nm.areNotificationsEnabled()) return false;
                      return Build.VERSION.SDK_INT < 33 || checkSelfPermission("android.permission.POST_NOTIFICATIONS") == PackageManager.PERMISSION_GRANTED;
                  }
                  private boolean ignoringBattery() { return ((PowerManager) getSystemService(POWER_SERVICE)).isIgnoringBatteryOptimizations(getPackageName()); }
                  private boolean dndAllowed() { return ((NotificationManager) getSystemService(NOTIFICATION_SERVICE)).isNotificationPolicyAccessGranted(); }
                  private boolean canFullScreen() { return Build.VERSION.SDK_INT < 34 || ((NotificationManager) getSystemService(NOTIFICATION_SERVICE)).canUseFullScreenIntent(); }
                  private void askNotify() {
                      if (Build.VERSION.SDK_INT >= 33) requestPermissions(new String[]{"android.permission.POST_NOTIFICATIONS"}, 7);
                      else { Intent i = new Intent(Settings.ACTION_APP_NOTIFICATION_SETTINGS); i.putExtra(Settings.EXTRA_APP_PACKAGE, getPackageName()); open(i); }
                  }
                  private void open(Intent i) { try { startActivity(i); } catch (Exception e) { Toast.makeText(this, "打不开系统设置，请手动去设置里找", Toast.LENGTH_SHORT).show(); } }
              }

              public static class TriggerLogActivity extends Activity {
                  @Override protected void onCreate(Bundle b) { super.onCreate(b); render(); }
                  private void render() {
                      ScrollView scroll = new ScrollView(this);
                      LinearLayout root = new LinearLayout(this);
                      root.setOrientation(LinearLayout.VERTICAL);
                      root.setPadding(dp(this, 18), dp(this, 24), dp(this, 18), dp(this, 32));
                      root.setBackground(new GradientDrawable(GradientDrawable.Orientation.TL_BR, new int[]{0xFFF9FBFF, 0xFFEAF1FB, 0xFFF5F7FC}));
                      root.addView(text(this, "触发日志", 26, 0xFF1E2430));
                      TextView sub = text(this, "最近 50 条飞书通知的处理结果", 13, 0xFF6B7280);
                      sub.setPadding(0, dp(this, 4), 0, dp(this, 14)); root.addView(sub);
                      List<TriggerLogStore.Entry> logs = TriggerLogStore.getLogs(this);
                      if (logs.isEmpty()) root.addView(text(this, "还没有记录", 13, 0xFF6B7280));
                      SimpleDateFormat f = new SimpleDateFormat("MM-dd HH:mm:ss", Locale.CHINA);
                      for (TriggerLogStore.Entry e : logs) {
                          LinearLayout c = card(this);
                          LinearLayout head = new LinearLayout(this); head.setOrientation(LinearLayout.HORIZONTAL); head.setGravity(Gravity.CENTER_VERTICAL);
                          TextView time = text(this, f.format(new Date(e.time)), 12, 0xFF6B7280);
                          time.setLayoutParams(new LinearLayout.LayoutParams(0, LinearLayout.LayoutParams.WRAP_CONTENT, 1)); head.addView(time);
                          head.addView(text(this, e.result, 12, resultColor(e.result))); c.addView(head);
                          c.addView(text(this, e.title, 14, 0xFF1F2937));
                          if (!e.text.isEmpty()) { TextView body = text(this, e.text, 12, 0xFF6B7280); body.setPadding(0, dp(this, 3), 0, 0); c.addView(body); }
                          root.addView(c);
                      }
                      Button clear = button(this, "清空记录", false);
                      clear.setOnClickListener(v -> { TriggerLogStore.clear(this); render(); });
                      root.addView(clear, params(this, false));
                      scroll.addView(root); setContentView(scroll);
                  }
                  private int resultColor(String r) { if ("已响铃".equals(r)) return 0xFFDC2626; if ("已停止".equals(r)) return 0xFF16A34A; return 0xFF6B7280; }
              }

              public static class ShiftPatternStore {
                  private static final String KEY_ENABLED = "shift_enabled", KEY_ANCHOR = "shift_anchor", KEY_WINDOWS = "shift_windows";
                  public static class Window { public int start, end; public boolean on; public Window(int s, int e, boolean o) { start = s; end = e; on = o; } }
                  static SharedPreferences prefs(Context c) { return MainActivity.ScheduleStore.prefs(c); }
                  public static boolean isEnabled(Context c) { return prefs(c).getBoolean(KEY_ENABLED, false); }
                  public static void setEnabled(Context c, boolean v) { prefs(c).edit().putBoolean(KEY_ENABLED, v).apply(); }
                  public static long getAnchor(Context c) { return prefs(c).getLong(KEY_ANCHOR, 0); }
                  public static void setAnchor(Context c, long v) { prefs(c).edit().putLong(KEY_ANCHOR, v).apply(); }
                  public static Window[] defaults() { return new Window[]{new Window(1350, 450, true), new Window(570, 1020, true), new Window(1380, 510, true)}; }
                  public static Window[] getWindows(Context c) {
                      Window[] w = defaults();
                      try {
                          JSONArray a = new JSONArray(prefs(c).getString(KEY_WINDOWS, "[]"));
                          for (int i = 0; i < 3 && i < a.length(); i++) {
                              JSONObject o = a.getJSONObject(i);
                              w[i].start = o.optInt("start", w[i].start); w[i].end = o.optInt("end", w[i].end); w[i].on = o.optBoolean("on", w[i].on);
                          }
                      } catch (Exception ignored) {}
                      return w;
                  }
                  public static void saveWindow(Context c, int index, int start, int end, boolean on) {
                      Window[] w = getWindows(c); w[index].start = start; w[index].end = end; w[index].on = on;
                      JSONArray a = new JSONArray();
                      for (Window x : w) {
                          try { JSONObject o = new JSONObject(); o.put("start", x.start); o.put("end", x.end); o.put("on", x.on); a.put(o); } catch (Exception ignored) {}
                      }
                      prefs(c).edit().putString(KEY_WINDOWS, a.toString()).apply();
                  }
                  public static int phaseNow(Context c) { return phaseAt(c, System.currentTimeMillis()); }
                  public static int phaseAt(Context c, long t) { long a = getAnchor(c); return a == 0 ? -1 : (int) Math.floorMod(days(a, t), 4L); }
                  private static long days(long a, long b) {
                      Calendar ca = Calendar.getInstance(); ca.setTimeInMillis(a); zero(ca);
                      Calendar cb = Calendar.getInstance(); cb.setTimeInMillis(b); zero(cb);
                      return (cb.getTimeInMillis() - ca.getTimeInMillis()) / 86400000L;
                  }
                  private static void zero(Calendar c) { c.set(Calendar.HOUR_OF_DAY, 0); c.set(Calendar.MINUTE, 0); c.set(Calendar.SECOND, 0); c.set(Calendar.MILLISECOND, 0); }
                  public static String phaseName(int p) { return p == 0 ? "白班" : p == 1 ? "夜班" : "休息"; }
                  public static String todayText(Context c) { int p = phaseNow(c); return p < 0 ? "未设置锚点日期" : "今天：" + phaseName(p) + "（第" + (p + 1) + "天）"; }
                  public static boolean isActive(Context c, long now) {
                      if (!isEnabled(c) || getAnchor(c) == 0) return false;
                      long d = days(getAnchor(c), now);
                      int today = (int) Math.floorMod(d, 4L), yesterday = (int) Math.floorMod(d - 1L, 4L);
                      Window[] w = getWindows(c);
                      Window tw = w[today == 0 ? 0 : today == 1 ? 1 : 2], yw = w[yesterday == 0 ? 0 : yesterday == 1 ? 1 : 2];
                      Calendar cal = Calendar.getInstance(); cal.setTimeInMillis(now);
                      int m = cal.get(Calendar.HOUR_OF_DAY) * 60 + cal.get(Calendar.MINUTE);
                      if (tw.on) {
                          if (tw.start == tw.end) return true;
                          if (tw.start < tw.end) { if (m >= tw.start && m < tw.end) return true; }
                          else if (m >= tw.start) return true;
                      }
                      return yw.on && yw.start > yw.end && m < yw.end;
                  }
                  public static String windowText(Window w) { return time(w.start) + " - " + (w.end < w.start ? "次日 " : "") + time(w.end); }
                  public static String time(int m) { return String.format(Locale.CHINA, "%02d:%02d", m / 60, m % 60); }
              }

              public static class ShiftPatternActivity extends Activity {
                  @Override protected void onCreate(Bundle b) { super.onCreate(b); render(); }
                  @Override protected void onResume() { super.onResume(); render(); }
                  private void render() {
                      ScrollView scroll = new ScrollView(this);
                      LinearLayout root = new LinearLayout(this);
                      root.setOrientation(LinearLayout.VERTICAL);
                      root.setPadding(dp(this, 18), dp(this, 24), dp(this, 18), dp(this, 32));
                      root.setBackground(new GradientDrawable(GradientDrawable.Orientation.TL_BR, new int[]{0xFFF9FBFF, 0xFFEAF1FB, 0xFFF5F7FC}));
                      root.addView(text(this, "白夜休休模板", 26, 0xFF1E2430));
                      TextView sub = text(this, "以锚点日期为第1天，按 白班 → 夜班 → 休 → 休 四天循环", 13, 0xFF6B7280);
                      sub.setPadding(0, dp(this, 4), 0, dp(this, 14)); root.addView(sub);

                      CheckBox enable = new CheckBox(this);
                      enable.setText("启用班表模板"); enable.setTextSize(16); enable.setTextColor(0xFF1E2430);
                      enable.setChecked(ShiftPatternStore.isEnabled(this));
                      enable.setOnCheckedChangeListener((v, checked) -> {
                          ShiftPatternStore.setEnabled(this, checked);
                          if (checked && ShiftPatternStore.getAnchor(this) == 0) {
                              Calendar c = Calendar.getInstance(); c.set(Calendar.HOUR_OF_DAY, 0); c.set(Calendar.MINUTE, 0); c.set(Calendar.SECOND, 0); c.set(Calendar.MILLISECOND, 0);
                              ShiftPatternStore.setAnchor(this, c.getTimeInMillis());
                          }
                          render();
                      });
                      root.addView(enable);

                      long anchor = ShiftPatternStore.getAnchor(this);
                      String anchorText = anchor == 0 ? "设置锚点日期（选你最近一次白班）" : "锚点日期：" + new SimpleDateFormat("yyyy-MM-dd", Locale.CHINA).format(new Date(anchor)) + "（第1天·白班）";
                      Button anchorBtn = button(this, anchorText, false);
                      anchorBtn.setOnClickListener(v -> pickAnchor());
                      root.addView(anchorBtn, params(this, false));

                      TextView status = text(this, ShiftPatternStore.todayText(this) + (ShiftPatternStore.isActive(this, System.currentTimeMillis()) ? " · 当前监控中" : " · 当前不在时段"), 13, 0xFF2563EB);
                      status.setPadding(0, dp(this, 10), 0, dp(this, 8)); root.addView(status);

                      String[] names = {"白班监控", "夜班监控", "休息监控"};
                      ShiftPatternStore.Window[] ws = ShiftPatternStore.getWindows(this);
                      for (int i = 0; i < 3; i++) {
                          final int index = i;
                          LinearLayout row = new LinearLayout(this); row.setOrientation(LinearLayout.HORIZONTAL); row.setGravity(Gravity.CENTER_VERTICAL);
                          CheckBox box = new CheckBox(this);
                          box.setText(names[i] + "\n" + ShiftPatternStore.windowText(ws[i]));
                          box.setTextSize(13); box.setTextColor(0xFF1F2937); box.setChecked(ws[i].on);
                          box.setLayoutParams(new LinearLayout.LayoutParams(0, LinearLayout.LayoutParams.WRAP_CONTENT, 1));
                          box.setOnCheckedChangeListener((v, checked) -> { ws[index].on = checked; ShiftPatternStore.saveWindow(this, index, ws[index].start, ws[index].end, checked); });
                          row.addView(box);
                          Button edit = button(this, "修改", false);
                          edit.setLayoutParams(new LinearLayout.LayoutParams(dp(this, 72), dp(this, 40)));
                          edit.setOnClickListener(v -> editWindow(index, ws[index]));
                          row.addView(edit); root.addView(row);
                      }

                      Button back = button(this, "返回", false);
                      back.setOnClickListener(v -> finish());
                      root.addView(back, params(this, false));
                      scroll.addView(root); setContentView(scroll);
                  }

                  private void editWindow(int index, ShiftPatternStore.Window w) {
                      LinearLayout box = new LinearLayout(this); box.setOrientation(LinearLayout.VERTICAL); box.setPadding(dp(this, 16), dp(this, 8), dp(this, 16), dp(this, 8));
                      box.addView(text(this, "开始", 14, Color.DKGRAY));
                      LinearLayout row1 = new LinearLayout(this); row1.setOrientation(LinearLayout.HORIZONTAL);
                      NumberPicker sh = num(0, 23, w.start / 60), sm = num(0, 59, w.start % 60);
                      row1.addView(sh, new LinearLayout.LayoutParams(0, dp(this, 140), 1)); row1.addView(sm, new LinearLayout.LayoutParams(0, dp(this, 140), 1)); box.addView(row1);
                      TextView end = text(this, "结束", 14, Color.DKGRAY); end.setPadding(0, dp(this, 8), 0, 0); box.addView(end);
                      LinearLayout row2 = new LinearLayout(this); row2.setOrientation(LinearLayout.HORIZONTAL);
                      NumberPicker eh = num(0, 23, w.end / 60), em = num(0, 59, w.end % 60);
                      row2.addView(eh, new LinearLayout.LayoutParams(0, dp(this, 140), 1)); row2.addView(em, new LinearLayout.LayoutParams(0, dp(this, 140), 1)); box.addView(row2);
                      TextView tip = text(this, "结束早于开始会自动按跨天处理", 12, Color.GRAY); tip.setPadding(0, dp(this, 6), 0, 0); box.addView(tip);
                      new AlertDialog.Builder(this).setTitle("修改监控时段").setView(box)
                              .setPositiveButton("保存", (d, which) -> {
                                  ShiftPatternStore.saveWindow(this, index, sh.getValue() * 60 + sm.getValue(), eh.getValue() * 60 + em.getValue(), w.on);
                                  render();
                              }).setNegativeButton("取消", null).show();
                  }

                  private NumberPicker num(int min, int max, int value) {
                      NumberPicker p = new NumberPicker(this); p.setMinValue(min); p.setMaxValue(max); p.setValue(value); p.setWrapSelectorWheel(true); return p;
                  }

                  private void pickAnchor() {
                      Calendar c = Calendar.getInstance(); long a = ShiftPatternStore.getAnchor(this); if (a > 0) c.setTimeInMillis(a);
                      new DatePickerDialog(this, (view, year, month, day) -> {
                          Calendar n = Calendar.getInstance(); n.set(year, month, day, 0, 0, 0); n.set(Calendar.MILLISECOND, 0);
                          ShiftPatternStore.setAnchor(this, n.getTimeInMillis()); render();
                      }, c.get(Calendar.YEAR), c.get(Calendar.MONTH), c.get(Calendar.DAY_OF_MONTH)).show();
                  }
              }
          }
          EOF

