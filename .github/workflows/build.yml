name: Build Duty Alarm APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Create project files
        run: |
          mkdir -p app/src/main/java/com/example/feishualarm

          cat > settings.gradle <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "DutyAlarm"
          include ':app'
          EOF

          cat > build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '8.5.2' apply false
          }
          EOF

          cat > gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.builder.sdkDownload=true
          EOF

          cat > app/build.gradle <<'EOF'
          plugins {
              id 'com.android.application'
          }

          android {
              namespace 'com.example.feishualarm'
              compileSdk 34

              defaultConfig {
                  applicationId "com.example.feishualarm"
                  minSdk 27
                  targetSdk 34
                  versionCode 1
                  versionName "1.0"
              }
          }
          EOF

          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <uses-permission android:name="android.permission.FOREGROUND_SERVICE" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE_SPECIAL_USE" />
              <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />
              <uses-permission android:name="android.permission.WAKE_LOCK" />
              <uses-permission android:name="android.permission.VIBRATE" />
              <uses-permission android:name="android.permission.MODIFY_AUDIO_SETTINGS" />
              <uses-permission android:name="android.permission.REQUEST_IGNORE_BATTERY_OPTIMIZATIONS" />
              <uses-permission android:name="android.permission.USE_FULL_SCREEN_INTENT" />
              <uses-permission android:name="android.permission.ACCESS_NOTIFICATION_POLICY" />

              <application
                  android:allowBackup="true"
                  android:label="夜班值守铃声"
                  android:theme="@android:style/Theme.Material.Light.NoActionBar">

                  <activity
                      android:name=".MainActivity"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>

                  <activity
                      android:name=".MainActivity$AlarmActivity"
                      android:exported="false"
                      android:launchMode="singleInstance"
                      android:excludeFromRecents="true"
                      android:showWhenLocked="true"
                      android:turnScreenOn="true" />

                  <service
                      android:name=".MainActivity$AlarmService"
                      android:exported="false"
                      android:foregroundServiceType="specialUse">
                      <property
                          android:name="android.app.PROPERTY_SPECIAL_USE_FGS_SUBTYPE"
                          android:value="notification alarm guard" />
                  </service>

                  <service
                      android:name=".MainActivity$FeishuNotificationListener"
                      android:exported="false"
                      android:permission="android.permission.BIND_NOTIFICATION_LISTENER_SERVICE">
                      <intent-filter>
                          <action android:name="android.service.notification.NotificationListenerService" />
                      </intent-filter>
                  </service>
              </application>
          </manifest>
          EOF

          cat > app/src/main/java/com/example/feishualarm/MainActivity.java <<'EOF'
          package com.example.feishualarm;

          import android.app.Activity;
          import android.app.AlertDialog;
          import android.app.KeyguardManager;
          import android.app.Notification;
          import android.app.NotificationChannel;
          import android.app.NotificationManager;
          import android.app.PendingIntent;
          import android.app.Service;
          import android.content.Context;
          import android.content.Intent;
          import android.content.SharedPreferences;
          import android.content.pm.PackageManager;
          import android.content.res.ColorStateList;
          import android.database.Cursor;
          import android.graphics.Color;
          import android.graphics.drawable.GradientDrawable;
          import android.graphics.drawable.RippleDrawable;
          import android.media.AudioAttributes;
          import android.media.AudioManager;
          import android.media.MediaPlayer;
          import android.media.Ringtone;
          import android.media.RingtoneManager;
          import android.net.Uri;
          import android.os.Build;
          import android.os.Bundle;
          import android.os.Handler;
          import android.os.IBinder;
          import android.os.Looper;
          import android.os.PowerManager;
          import android.os.VibrationEffect;
          import android.os.Vibrator;
          import android.provider.Settings;
          import android.text.TextUtils;
          import android.view.Gravity;
          import android.view.HapticFeedbackConstants;
          import android.view.KeyEvent;
          import android.view.MotionEvent;
          import android.view.View;
          import android.view.WindowManager;
          import android.widget.AdapterView;
          import android.widget.ArrayAdapter;
          import android.widget.Button;
          import android.widget.CheckBox;
          import android.widget.HorizontalScrollView;
          import android.widget.ImageView;
          import android.widget.LinearLayout;
          import android.widget.NumberPicker;
          import android.widget.ScrollView;
          import android.widget.Spinner;
          import android.widget.TextView;
          import android.widget.Toast;
          import org.json.JSONArray;
          import org.json.JSONObject;
          import java.io.File;
          import java.io.FileOutputStream;
          import java.io.InputStream;
          import java.io.OutputStream;
          import java.text.Collator;
          import java.util.ArrayList;
          import java.util.Calendar;
          import java.util.Collections;
          import java.util.List;
          import java.util.Set;

          public class MainActivity extends Activity {

              private LinearLayout scheduleList;
              private LinearLayout permissionContainer;
              private LinearLayout appsPreview;
              private Spinner ringtoneSpinner;
              private List<RingtoneHelper.Option> builtIn;
              private TextView customLabel;
              private CheckBox enableBox;

              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  getWindow().addFlags(WindowManager.LayoutParams.FLAG_DRAWS_SYSTEM_BAR_BACKGROUNDS);
                  getWindow().setStatusBarColor(0xFFF9FBFF);
                  getWindow().setNavigationBarColor(0xFFF5F7FC);
                  getWindow().getDecorView().setSystemUiVisibility(
                          View.SYSTEM_UI_FLAG_LIGHT_STATUS_BAR
                                  | View.SYSTEM_UI_FLAG_LIGHT_NAVIGATION_BAR);

                  builtIn = RingtoneHelper.getBuiltIn(this);
                  buildUi();
                  requestNotificationPermission();
              }

              private void buildUi() {
                  ScrollView scroll = new ScrollView(this);
                  scroll.setOverScrollMode(View.OVER_SCROLL_NEVER);
                  LinearLayout root = new LinearLayout(this);
                  root.setOrientation(LinearLayout.VERTICAL);
                  root.setPadding(dp(this, 18), dp(this, 24), dp(this, 18), dp(this, 32));
                  root.setBackground(new GradientDrawable(
                          GradientDrawable.Orientation.TL_BR,
                          new int[]{0xFFF9FBFF, 0xFFEAF1FB, 0xFFF5F7FC}));
                  scroll.addView(root);

                  TextView title = new TextView(this);
                  title.setText("夜班值守铃声");
                  title.setTextColor(0xFF1E2430);
                  title.setTextSize(28);
                  title.setGravity(Gravity.START);
                  root.addView(title);

                  TextView subtitle = new TextView(this);
                  subtitle.setText("应用消息提醒 · 只在设定时间响铃");
                  subtitle.setTextColor(0xFF6B7280);
                  subtitle.setTextSize(13);
                  subtitle.setPadding(0, dp(this, 4), 0, dp(this, 16));
                  root.addView(subtitle);

                  LinearLayout appsCard = card();
                  appsCard.addView(section("监控的应用"));
                  HorizontalScrollView appRowScroll = new HorizontalScrollView(this);
                  appRowScroll.setHorizontalScrollBarEnabled(false);
                  appsPreview = new LinearLayout(this);
                  appsPreview.setOrientation(LinearLayout.HORIZONTAL);
                  appsPreview.setPadding(0, dp(this, 2), 0, dp(this, 8));
                  appRowScroll.addView(appsPreview);
                  appsCard.addView(appRowScroll);
                  appsCard.addView(primaryButton("选择要监控的应用", v ->
                          startActivity(new Intent(this, Extras.AppPickerActivity.class))));
                  root.addView(appsCard);

                  LinearLayout statusCard = card();
                  enableBox = new CheckBox(this);
                  enableBox.setText("启用响铃监控");
                  enableBox.setTextColor(0xFF1E2430);
                  enableBox.setTextSize(16);
                  enableBox.setPadding(0, dp(this, 4), 0, 0);
                  enableBox.setChecked(ScheduleStore.isEnabled(this));
                  enableBox.setOnCheckedChangeListener((v, checked) -> {
                      ScheduleStore.setEnabled(this, checked);
                      if (checked) {
                          AlarmService.startGuard(this);
                          Extras.WatchdogReceiver.schedule(this);
                      } else {
                          AlarmService.stopGuard(this);
                          Extras.WatchdogReceiver.cancel(this);
                      }
                  });
                  statusCard.addView(enableBox);

                  TextView statusHint = new TextView(this);
                  statusHint.setText("开启后，只在下方时间段内响铃");
                  statusHint.setTextColor(0xFF6B7280);
                  statusHint.setTextSize(12);
                  statusHint.setPadding(0, dp(this, 4), 0, 0);
                  statusCard.addView(statusHint);
                  root.addView(statusCard);

                  LinearLayout permissionCard = card();
                  permissionCard.addView(section("权限自检"));

                  TextView permSub = new TextView(this);
                  permSub.setText("全部绿灯，应用消息才不会被系统拦掉");
                  permSub.setTextColor(0xFF6B7280);
                  permSub.setTextSize(13);
                  permSub.setPadding(0, 0, 0, dp(this, 4));
                  permissionCard.addView(permSub);

                  permissionContainer = new LinearLayout(this);
                  permissionContainer.setOrientation(LinearLayout.VERTICAL);
                  permissionCard.addView(permissionContainer);
                  root.addView(permissionCard);

                  LinearLayout ringCard = card();
                  ringCard.addView(section("铃声"));
                  ringtoneSpinner = new Spinner(this);
                  ArrayAdapter<String> adapter = new ArrayAdapter<>(
                          this, android.R.layout.simple_spinner_item);
                  for (RingtoneHelper.Option option : builtIn) {
                      adapter.add(option.title);
                  }
                  adapter.setDropDownViewResource(android.R.layout.simple_spinner_dropdown_item);
                  ringtoneSpinner.setAdapter(adapter);

                  String saved = ScheduleStore.prefs(this).getString(ScheduleStore.KEY_RINGTONE, "");
                  int selected = 0;
                  for (int i = 0; i < builtIn.size(); i++) {
                      if (("builtin:" + builtIn.get(i).uri).equals(saved)) {
                          selected = i;
                      }
                  }
                  ringtoneSpinner.setSelection(selected);
                  ringtoneSpinner.setOnItemSelectedListener(new AdapterView.OnItemSelectedListener() {
                      @Override
                      public void onItemSelected(AdapterView<?> parent, View view, int position, long id) {
                          RingtoneHelper.setSelected(MainActivity.this,
                                  "builtin:" + builtIn.get(position).uri);
                          updateRingtoneLabel();
                      }

                      @Override
                      public void onNothingSelected(AdapterView<?> parent) {
                      }
                  });
                  ringCard.addView(ringtoneSpinner);

                  customLabel = new TextView(this);
                  customLabel.setTextColor(0xFF6B7280);
                  customLabel.setTextSize(12);
                  customLabel.setPadding(0, dp(this, 6), 0, dp(this, 8));
                  ringCard.addView(customLabel);

                  ringCard.addView(secondaryButton("选择自定义铃声", v -> pickCustomRingtone()));
                  root.addView(ringCard);

                  LinearLayout scheduleCard = card();
                  scheduleCard.addView(section("启用时间段"));
                  scheduleList = new LinearLayout(this);
                  scheduleList.setOrientation(LinearLayout.VERTICAL);
                  scheduleCard.addView(scheduleList);
                  scheduleCard.addView(primaryButton("添加时间段", v -> showAddScheduleDialog()));
                  root.addView(scheduleCard);

                  LinearLayout testCard = card();
                  testCard.addView(section("测试"));
                  testCard.addView(primaryButton("测试响铃", v ->
                          AlarmService.trigger(this, "测试消息", "这是测试铃声")));
                  testCard.addView(secondaryButton("查看触发日志", v ->
                          startActivity(new Intent(this, Extras.TriggerLogActivity.class))));
                  TextView note = new TextView(this);
                  note.setText("说明：需要允许通知使用权；被监控的应用不能被静音；手机重启后会自动恢复监控，但被系统强行停止后需要手动打开一次本 App。安卓不允许任何 App 阻止强制停止、重启或音量键。");
                  note.setTextColor(0xFF6B7280);
                  note.setTextSize(12);
                  note.setPadding(0, dp(this, 16), 0, 0);
                  testCard.addView(note);
                  root.addView(testCard);

                  setContentView(scroll);
                  updateRingtoneLabel();
                  renderSelectedApps();
                  renderPermissionChecks();
              }

              private LinearLayout card() {
                  LinearLayout card = new LinearLayout(this);
                  card.setOrientation(LinearLayout.VERTICAL);
                  card.setPadding(dp(this, 18), dp(this, 16), dp(this, 18), dp(this, 16));
                  GradientDrawable background = new GradientDrawable(
                          GradientDrawable.Orientation.TL_BR,
                          new int[]{0xE6FFFFFF, 0xCCFFFFFF});
                  background.setCornerRadius(dp(this, 24));
                  background.setStroke(dp(this, 1), 0x99FFFFFF);
                  card.setBackground(background);
                  card.setElevation(0);
                  LinearLayout.LayoutParams params = new LinearLayout.LayoutParams(
                          LinearLayout.LayoutParams.MATCH_PARENT,
                          LinearLayout.LayoutParams.WRAP_CONTENT);
                  params.bottomMargin = dp(this, 16);
                  card.setLayoutParams(params);
                  return card;
              }

              private TextView section(String text) {
                  TextView view = new TextView(this);
                  view.setText(text);
                  view.setTextColor(0xFF2563EB);
                  view.setTextSize(13);
                  view.setPadding(0, dp(this, 8), 0, dp(this, 8));
                  return view;
              }

              private Button secondaryButton(String text, View.OnClickListener listener) {
                  Button button = new Button(this);
                  button.setText(text);
                  button.setAllCaps(false);
                  button.setTextSize(14);
                  button.setTextColor(0xFF1F2937);
                  button.setStateListAnimator(null);
                  button.setElevation(0f);

                  GradientDrawable background = new GradientDrawable();
                  background.setColor(0xFFF3F6FB);
                  background.setCornerRadius(dp(this, 14));
                  background.setStroke(dp(this, 1), 0xFFE2E8F0);
                  button.setBackground(new RippleDrawable(
                          ColorStateList.valueOf(0x332563EB), background, background));

                  button.setOnClickListener(listener);
                  applyPressFeedback(button);
                  LinearLayout.LayoutParams params = new LinearLayout.LayoutParams(
                          LinearLayout.LayoutParams.MATCH_PARENT, dp(this, 46));
                  params.topMargin = dp(this, 8);
                  button.setLayoutParams(params);
                  return button;
              }

              private Button primaryButton(String text, View.OnClickListener listener) {
                  Button button = new Button(this);
                  button.setText(text);
                  button.setAllCaps(false);
                  button.setTextSize(15);
                  button.setTextColor(Color.WHITE);
                  button.setStateListAnimator(null);
                  button.setElevation(0f);

                  GradientDrawable background = new GradientDrawable();
                  background.setColor(0xFF2563EB);
                  background.setCornerRadius(dp(this, 14));
                  button.setBackground(new RippleDrawable(
                          ColorStateList.valueOf(0x40FFFFFF), background, background));

                  button.setOnClickListener(listener);
                  applyPressFeedback(button);
                  LinearLayout.LayoutParams params = new LinearLayout.LayoutParams(
                          LinearLayout.LayoutParams.MATCH_PARENT, dp(this, 50));
                  params.topMargin = dp(this, 10);
                  button.setLayoutParams(params);
                  return button;
              }

              private Button smallButton(String text, View.OnClickListener listener) {
                  Button button = new Button(this);
                  button.setText(text);
                  button.setAllCaps(false);
                  button.setTextSize(12);
                  button.setTextColor(0xFFDC2626);
                  button.setStateListAnimator(null);
                  button.setElevation(0f);

                  GradientDrawable background = new GradientDrawable();
                  background.setColor(0xFFFFF1F2);
                  background.setCornerRadius(dp(this, 12));
                  button.setBackground(new RippleDrawable(
                          ColorStateList.valueOf(0x33DC2626), background, background));

                  button.setOnClickListener(listener);
                  applyPressFeedback(button);
                  button.setLayoutParams(new LinearLayout.LayoutParams(
                          LinearLayout.LayoutParams.WRAP_CONTENT, dp(this, 36)));
                  return button;
              }

              static void applyPressFeedback(View view) {
                  view.setOnTouchListener((v, event) -> {
                      switch (event.getActionMasked()) {
                          case MotionEvent.ACTION_DOWN:
                              v.animate()
                                      .scaleX(0.96f)
                                      .scaleY(0.96f)
                                      .setDuration(90)
                                      .start();
                              v.performHapticFeedback(
                                      HapticFeedbackConstants.KEYBOARD_TAP);
                              break;
                          case MotionEvent.ACTION_UP:
                          case MotionEvent.ACTION_CANCEL:
                              v.animate()
                                      .scaleX(1f)
                                      .scaleY(1f)
                                      .setDuration(130)
                                      .start();
                              break;
                      }
                      return false;
                  });
              }

              private void renderSelectedApps() {
                  if (appsPreview == null) return;
                  appsPreview.removeAllViews();
                  Set<String> selected = Extras.MonitoredAppsStore.get(this);
                  if (selected.isEmpty()) {
                      TextView empty = new TextView(this);
                      empty.setText("还没有选择应用");
                      empty.setTextColor(0xFF6B7280);
                      empty.setTextSize(13);
                      empty.setPadding(0, dp(this, 4), 0, dp(this, 4));
                      appsPreview.addView(empty);
                      return;
                  }

                  PackageManager pm = getPackageManager();
                  List<String[]> entries = new ArrayList<>();
                  for (String pkg : selected) {
                      try {
                          String label = pm.getApplicationLabel(
                                  pm.getApplicationInfo(pkg, 0)).toString();
                          entries.add(new String[]{label, pkg});
                      } catch (Exception ignored) {
                      }
                  }
                  Collections.sort(entries, (a, b) ->
                          Collator.getInstance(java.util.Locale.CHINA).compare(a[0], b[0]));

                  for (String[] entry : entries) {
                      LinearLayout item = new LinearLayout(this);
                      item.setOrientation(LinearLayout.VERTICAL);
                      item.setGravity(Gravity.CENTER);
                      LinearLayout.LayoutParams itemParams = new LinearLayout.LayoutParams(
                              dp(this, 64), LinearLayout.LayoutParams.WRAP_CONTENT);
                      itemParams.rightMargin = dp(this, 12);

                      ImageView icon = new ImageView(this);
                      icon.setLayoutParams(new LinearLayout.LayoutParams(
                              dp(this, 44), dp(this, 44)));
                      icon.setScaleType(ImageView.ScaleType.FIT_CENTER);
                      try {
                          icon.setImageDrawable(pm.getApplicationIcon(entry[1]));
                      } catch (Exception ignored) {
                      }
                      item.addView(icon);

                      TextView name = new TextView(this);
                      name.setText(entry[0]);
                      name.setTextColor(0xFF4B5563);
                      name.setTextSize(11);
                      name.setGravity(Gravity.CENTER);
                      name.setMaxLines(1);
                      name.setEllipsize(TextUtils.TruncateAt.END);
                      name.setPadding(0, dp(this, 3), 0, 0);
                      item.addView(name);
                      appsPreview.addView(item, itemParams);
                  }
              }

              private void renderPermissionChecks() {
                  if (permissionContainer == null) return;
                  permissionContainer.removeAllViews();
                  addPermissionRow("通知使用权", "读取应用通知的钥匙，升级后要重新勾选一次",
                          Extras.NotifyListener.hasAccess(this), "去开启",
                          v -> startActivity(new Intent(Settings.ACTION_NOTIFICATION_LISTENER_SETTINGS)), null);
                  addPermissionRow("通知权限", "Android 13 以上要允许本 App 发通知",
                          Extras.notificationsEnabled(this), "去开启", v -> {
                              if (Build.VERSION.SDK_INT >= 33) {
                                  requestPermissions(new String[]{"android.permission.POST_NOTIFICATIONS"}, 2);
                              } else {
                                  startActivity(new Intent(Settings.ACTION_APP_NOTIFICATION_SETTINGS)
                                          .putExtra(Settings.EXTRA_APP_PACKAGE, getPackageName()));
                              }
                          }, null);
                  addPermissionRow("电池优化白名单", "防止系统把后台监控杀掉",
                          Extras.ignoringBattery(this), "去设置", v -> {
                              try {
                                  startActivity(new Intent(Settings.ACTION_REQUEST_IGNORE_BATTERY_OPTIMIZATIONS,
                                          Uri.parse("package:" + getPackageName())));
                              } catch (Exception e) {
                                  toast("请到系统设置里关闭电池优化");
                              }
                          }, null);
                  addPermissionRow("勿扰访问权限", "读取勿扰状态，避免静音时漏消息",
                          Extras.dndAllowed(this), "去授权",
                          v -> startActivity(new Intent(Settings.ACTION_NOTIFICATION_POLICY_ACCESS_SETTINGS)), null);
                  if (Build.VERSION.SDK_INT >= 34) {
                      addPermissionRow("全屏通知", "锁屏时弹出响铃页面",
                              Extras.canFullScreen(this), "去允许", v -> {
                                  try {
                                      startActivity(new Intent(Settings.ACTION_MANAGE_APP_USE_FULL_SCREEN_INTENT,
                                              Uri.parse("package:" + getPackageName())));
                                  } catch (Exception e) {
                                      toast("请到系统设置里允许全屏通知");
                                  }
                              }, null);
                  } else {
                      addPermissionRow("全屏通知", "当前系统版本默认允许", true, "", null, null);
                  }
                  addPermissionRow("自启动 / 后台弹出", "小米、OPPO、vivo 等机型需在厂商设置里手动允许",
                          false, "去查看", v -> {
                              try {
                                  startActivity(new Intent(Settings.ACTION_APPLICATION_DETAILS_SETTINGS,
                                          Uri.parse("package:" + getPackageName())));
                              } catch (Exception e) {
                                  toast("请到系统设置里查看");
                              }
                          }, "需手动确认");
              }

              private void addPermissionRow(String title, String desc, boolean ok,
                                            String action, View.OnClickListener listener, String override) {
                  View divider = new View(this);
                  divider.setBackgroundColor(0xFFE5E7EB);
                  permissionContainer.addView(divider, new LinearLayout.LayoutParams(
                          LinearLayout.LayoutParams.MATCH_PARENT, dp(this, 1)));

                  LinearLayout row = new LinearLayout(this);
                  row.setOrientation(LinearLayout.VERTICAL);
                  row.setPadding(0, dp(this, 12), 0, dp(this, 12));

                  LinearLayout head = new LinearLayout(this);
                  head.setOrientation(LinearLayout.HORIZONTAL);
                  head.setGravity(Gravity.CENTER_VERTICAL);

                  TextView name = new TextView(this);
                  name.setText(title);
                  name.setTextColor(0xFF1F2937);
                  name.setTextSize(15);
                  name.setLayoutParams(new LinearLayout.LayoutParams(
                          0, LinearLayout.LayoutParams.WRAP_CONTENT, 1));
                  head.addView(name);

                  TextView state = new TextView(this);
                  state.setText(override != null ? override : (ok ? "已开启" : "未开启"));
                  state.setTextColor(override != null ? 0xFF6B7280 : (ok ? 0xFF16A34A : 0xFFDC2626));
                  state.setTextSize(12);
                  head.addView(state);
                  row.addView(head);

                  TextView detail = new TextView(this);
                  detail.setText(desc);
                  detail.setTextColor(0xFF6B7280);
                  detail.setTextSize(12);
                  detail.setPadding(0, dp(this, 4), 0, dp(this, 8));
                  row.addView(detail);

                  if (!ok && listener != null) {
                      row.addView(secondaryButton(action, listener));
                  }
                  permissionContainer.addView(row);
              }

              private NumberPicker makeDayPicker() {
                  NumberPicker picker = new NumberPicker(this);
                  picker.setMinValue(0);
                  picker.setMaxValue(6);
                  picker.setDisplayedValues(new String[]{
                          "周一", "周二", "周三", "周四", "周五", "周六", "周日"
                  });
                  picker.setWrapSelectorWheel(true);
                  return picker;
              }

              private NumberPicker makeNumberPicker(int min, int max, int value) {
                  NumberPicker picker = new NumberPicker(this);
                  picker.setMinValue(min);
                  picker.setMaxValue(max);
                  picker.setValue(value);
                  picker.setWrapSelectorWheel(true);
                  return picker;
              }

              private void showAddScheduleDialog() {
                  LinearLayout box = new LinearLayout(this);
                  box.setOrientation(LinearLayout.VERTICAL);
                  box.setPadding(dp(this, 16), dp(this, 12), dp(this, 16), dp(this, 12));

                  TextView startTitle = new TextView(this);
                  startTitle.setText("开始");
                  startTitle.setTextSize(14);
                  startTitle.setTextColor(Color.DKGRAY);
                  box.addView(startTitle);

                  LinearLayout startRow = new LinearLayout(this);
                  startRow.setOrientation(LinearLayout.HORIZONTAL);
                  NumberPicker startDay = makeDayPicker();
                  NumberPicker startHour = makeNumberPicker(0, 23, 18);
                  NumberPicker startMinute = makeNumberPicker(0, 59, 0);
                  startRow.addView(startDay,
                          new LinearLayout.LayoutParams(0, dp(this, 140), 1.4f));
                  startRow.addView(startHour,
                          new LinearLayout.LayoutParams(0, dp(this, 140), 1f));
                  startRow.addView(startMinute,
                          new LinearLayout.LayoutParams(0, dp(this, 140), 1f));
                  box.addView(startRow);

                  TextView endTitle = new TextView(this);
                  endTitle.setText("结束");
                  endTitle.setTextSize(14);
                  endTitle.setTextColor(Color.DKGRAY);
                  endTitle.setPadding(0, dp(this, 12), 0, 0);
                  box.addView(endTitle);

                  LinearLayout endRow = new LinearLayout(this);
                  endRow.setOrientation(LinearLayout.HORIZONTAL);
                  NumberPicker endHour = makeNumberPicker(0, 23, 6);
                  NumberPicker endMinute = makeNumberPicker(0, 59, 0);
                  endRow.addView(endHour,
                          new LinearLayout.LayoutParams(0, dp(this, 140), 1f));
                  endRow.addView(endMinute,
                          new LinearLayout.LayoutParams(0, dp(this, 140), 1f));
                  box.addView(endRow);

                  TextView tip = new TextView(this);
                  tip.setText("结束时间早于开始时间，会自动按跨天处理");
                  tip.setTextSize(12);
                  tip.setTextColor(Color.GRAY);
                  tip.setPadding(0, dp(this, 8), 0, 0);
                  box.addView(tip);

                  ScrollView scroll = new ScrollView(this);
                  scroll.addView(box);

                  new AlertDialog.Builder(this)
                          .setTitle("添加时间段")
                          .setView(scroll)
                          .setPositiveButton("添加", (dialog, which) -> {
                              int days = 1 << startDay.getValue();
                              int startMinutes =
                                      startHour.getValue() * 60 + startMinute.getValue();
                              int endMinutes =
                                      endHour.getValue() * 60 + endMinute.getValue();

                              List<ScheduleStore.Schedule> list =
                                      ScheduleStore.getSchedules(MainActivity.this);
                              list.add(new ScheduleStore.Schedule(days, startMinutes, endMinutes));
                              ScheduleStore.saveSchedules(MainActivity.this, list);
                              renderSchedules();
                          })
                          .setNegativeButton("取消", null)
                          .show();
              }

              private void renderSchedules() {
                  if (scheduleList == null) return;
                  scheduleList.removeAllViews();
                  List<ScheduleStore.Schedule> schedules = ScheduleStore.getSchedules(this);
                  if (schedules.isEmpty()) {
                      TextView empty = new TextView(this);
                      empty.setText("还没有时间段，点下面添加");
                      empty.setTextColor(0xFF6B7280);
                      empty.setTextSize(13);
                      scheduleList.addView(empty);
                      return;
                  }
                  for (int i = 0; i < schedules.size(); i++) {
                      final int index = i;
                      LinearLayout row = new LinearLayout(this);
                      row.setOrientation(LinearLayout.HORIZONTAL);
                      row.setGravity(Gravity.CENTER_VERTICAL);
                      row.setPadding(0, dp(this, 6), 0, dp(this, 6));

                      TextView text = new TextView(this);
                      text.setText(ScheduleStore.describe(schedules.get(i)));
                      text.setTextColor(0xFF1F2937);
                      text.setTextSize(13);
                      text.setLayoutParams(new LinearLayout.LayoutParams(
                              0, LinearLayout.LayoutParams.WRAP_CONTENT, 1));

                      Button delete = smallButton("删除", v -> {
                          List<ScheduleStore.Schedule> list = ScheduleStore.getSchedules(MainActivity.this);
                          if (index < list.size()) list.remove(index);
                          ScheduleStore.saveSchedules(MainActivity.this, list);
                          renderSchedules();
                      });

                      row.addView(text);
                      row.addView(delete);
                      scheduleList.addView(row);
                  }
              }

              private void pickCustomRingtone() {
                  Intent intent = new Intent(Intent.ACTION_OPEN_DOCUMENT);
                  intent.addCategory(Intent.CATEGORY_OPENABLE);
                  intent.setType("audio/*");
                  startActivityForResult(intent, 100);
              }

              @Override
              protected void onActivityResult(int requestCode, int resultCode, Intent data) {
                  super.onActivityResult(requestCode, resultCode, data);
                  if (requestCode == 100 && resultCode == RESULT_OK && data != null && data.getData() != null) {
                      try {
                          InputStream in = getContentResolver().openInputStream(data.getData());
                          File output = new File(getFilesDir(), "custom_ringtone");
                          OutputStream out = new FileOutputStream(output);
                          byte[] buffer = new byte[8192];
                          int length;
                          while (in != null && (length = in.read(buffer)) > 0) {
                              out.write(buffer, 0, length);
                          }
                          if (in != null) in.close();
                          out.close();
                          RingtoneHelper.setSelected(this, "custom:" + output.getAbsolutePath());
                          updateRingtoneLabel();
                          toast("自定义铃声已保存");
                      } catch (Exception e) {
                          toast("保存失败：" + e.getMessage());
                      }
                  }
              }

              private void updateRingtoneLabel() {
                  if (customLabel == null) return;
                  String value = ScheduleStore.prefs(this).getString(ScheduleStore.KEY_RINGTONE, "");
                  if (value.startsWith("custom:")) {
                      customLabel.setText("当前：自定义铃声");
                  } else {
                      customLabel.setText("当前：系统铃声");
                  }
              }

              private void requestNotificationPermission() {
                  if (Build.VERSION.SDK_INT >= 33 &&
                          checkSelfPermission("android.permission.POST_NOTIFICATIONS")
                                  != PackageManager.PERMISSION_GRANTED) {
                      requestPermissions(new String[]{"android.permission.POST_NOTIFICATIONS"}, 1);
                  }
              }

              @Override
              public void onRequestPermissionsResult(int requestCode, String[] permissions, int[] grantResults) {
                  super.onRequestPermissionsResult(requestCode, permissions, grantResults);
                  renderPermissionChecks();
              }

              @Override
